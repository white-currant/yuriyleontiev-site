<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Подземелье — прототип</title>
<style>
  :root { --u: 2.6px; --ink: #0b0a10; --slate: #20222b; --slate2: #2c2f3b; --edge: #565b6c; --edge2: #14151b; --cream: #efe6d2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; }
  body { display: grid; place-items: center; font-family: -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; color: var(--cream); }
  #stage { position: relative; width: min(100vw, calc(100vh * 144 / 256)); aspect-ratio: 144 / 256; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #scene, #herol { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #herol { pointer-events: none; }
  /* убежище — его фон (2026-11-17), мой нарисованный выключен; герой стоит крупно в центре */
  #stage { background: #07060a url(hub-bg.webp) center / 100% 100% no-repeat; }
  #scene { opacity: 0; }
  canvas.ic { image-rendering: pixelated; display: block; flex: none; }
  /* панели интерфейса: тёмный сланец, рамка со срезанными углами */
  .pan { background: var(--slate); box-shadow: 0 0 0 var(--u) var(--edge2), inset 0 var(--u) 0 var(--edge), inset 0 calc(var(--u) * -1) 0 #16171d, inset var(--u) 0 0 #3a3e4b, inset calc(var(--u) * -1) 0 0 #16171d;
    clip-path: polygon(var(--u) 0, calc(100% - var(--u)) 0, 100% var(--u), 100% calc(100% - var(--u)), calc(100% - var(--u)) 100%, var(--u) 100%, 0 calc(100% - var(--u)), 0 var(--u)); }
  #top { position: absolute; left: calc(var(--u) * 4); right: calc(var(--u) * 4); top: calc(var(--u) * 4 + env(safe-area-inset-top)); display: flex; align-items: flex-start; gap: calc(var(--u) * 3); }
  #face { width: calc(var(--u) * 22); height: calc(var(--u) * 22); display: grid; place-items: center; }
  #bars { display: grid; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 1); }
  .bar { position: relative; width: calc(var(--u) * 44); height: calc(var(--u) * 9); display: flex; align-items: center; }
  .bar canvas { position: absolute; left: calc(var(--u) * -1); z-index: 2; }
  .bar .fill { position: absolute; left: calc(var(--u) * 7); right: calc(var(--u) * 1.5); top: calc(var(--u) * 1.5); bottom: calc(var(--u) * 1.5); background: #15161c; }
  .bar .fill i { display: block; height: 100%; }
  button.bar { border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  .bar.hp .fill i { background: linear-gradient(#e2574b 0 45%, #b8322c 45%); }
  .bar.en .fill i { background: linear-gradient(#58a9ee 0 45%, #2f6fb8 45%); }
  .bar b { position: relative; z-index: 3; width: 100%; padding-left: calc(var(--u) * 7); text-align: center; font-size: calc(var(--u) * 4.4); font-weight: 800; letter-spacing: .02em; text-shadow: 0 calc(var(--u) * .6) 0 rgba(0, 0, 0, .7); }
  #res { margin-left: auto; display: grid; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 1); }
  .cnt { width: calc(var(--u) * 34); height: calc(var(--u) * 9); display: flex; align-items: center; gap: calc(var(--u) * 3); padding: 0 calc(var(--u) * 3); font-size: calc(var(--u) * 4.6); font-weight: 800; }
  #gear { width: calc(var(--u) * 15); height: calc(var(--u) * 15); display: grid; place-items: center; margin-top: calc(var(--u) * 1); border: 0; padding: 0; color: inherit; }
  #bottom { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 6 + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: calc(var(--u) * 6); }
  .act { width: calc(var(--u) * 24); height: calc(var(--u) * 24); display: grid; place-items: center; border: 0; padding: 0; color: inherit; cursor: pointer; transition: transform .06s; }
  .act:active { transform: translateY(var(--u)); filter: brightness(1.25); }
  .act.go { background: #2b2430; box-shadow: 0 0 0 var(--u) var(--edge2), inset 0 var(--u) 0 #8a6a4a, inset 0 calc(var(--u) * -1) 0 #16171d, inset var(--u) 0 0 #5a4636, inset calc(var(--u) * -1) 0 0 #16171d; }
  #say { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); max-width: 84%; padding: calc(var(--u) * 3) calc(var(--u) * 5); font-size: calc(var(--u) * 4.6); font-weight: 700; line-height: 1.3; text-align: center;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  #say.on { opacity: 1; }
  #say { z-index: 5; }
  /* выбор подземелья (его решение 2026-11-19): размер и плата едой — «сытость» = очки блюда */
  #pick { position: absolute; inset: 0; display: none; place-items: center; background: rgba(6, 5, 9, .55); }
  #pick.on { display: grid; }
  #pick > div { width: 74%; padding: calc(var(--u) * 5); display: grid; gap: calc(var(--u) * 3); text-align: center; }
  #pick p { margin: 0 0 calc(var(--u) * 1); font-size: calc(var(--u) * 6.4); font-weight: 800; }
  #pick button { height: calc(var(--u) * 17); border: 0; color: inherit; font: inherit; font-size: calc(var(--u) * 5.6); font-weight: 800; cursor: pointer; display: grid; place-items: center; line-height: 1.15; }
  #pick button small { display: block; font-size: calc(var(--u) * 4.2); font-weight: 600; opacity: .75; }
  #pick button[data-size], #pick #resume { align-content: center; row-gap: calc(var(--u) * .6); line-height: 1.1; }   /* строки кнопки — вместе по центру, а не по половинам высоты (его правка 2026-11-19) */
  #pick button small:empty { display: none; }                               /* нет подписи — название ровно по центру */
  #pick button:active { filter: brightness(1.25); }
  #pick button:disabled { opacity: .45; }
  #pick button[hidden] { display: none; }                                   /* «Продолжить поход» без похода не показывать: display: grid выше перебивал hidden (2026-11-19) */
  #pick .need { display: none; }                                            /* пояснение под «Куда спускаемся?» убрано (его правка 2026-11-19) */
  /* окна убежища (2026-11-19): рюкзак, рынок, котёл — снизу, над кнопками */
  #sheet { position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--u) * 32 + env(safe-area-inset-bottom)); display: none; align-items: flex-end; justify-content: center; background: rgba(6, 5, 9, .6); }
  #sheet.on { display: flex; }
  /* крестик закрытия во всех окнах убежища (его просьба 2026-11-19, «как в меню на ферме») — квадратная кнопка в цветах убежища */
  .shx { position: absolute; top: calc(var(--u) * 3); right: calc(var(--u) * 3); z-index: 3; width: calc(var(--u) * 10); height: calc(var(--u) * 10); padding: 0; border: 0; display: grid; place-items: center;
    background: #3a3e4b; color: var(--cream); font: inherit; font-size: calc(var(--u) * 5); font-weight: 800; line-height: 1; cursor: pointer;
    box-shadow: 0 0 0 calc(var(--u) * .8) #14151b, inset 0 calc(var(--u) * -1.2) 0 #23252e, inset 0 calc(var(--u) * .8) 0 #5a5f70; }
  .shx:active { transform: translateY(calc(var(--u) * .4)); filter: brightness(1.2); }
  #sheetbox, #pick > div { position: relative; }
  #pick .shx { height: calc(var(--u) * 10); font-size: calc(var(--u) * 5); }
  #sheetbox.cube .shx { background: #2c3634; color: #b9f7c4; box-shadow: 0 0 0 calc(var(--u) * .8) #0a0d0d, inset 0 calc(var(--u) * -1.2) 0 #161c1c, inset 0 calc(var(--u) * .8) 0 #55625f; }
  #sheetbox { width: calc(100% - var(--u) * 8); max-height: 74%; overflow-y: auto; margin-bottom: calc(var(--u) * 3); padding: calc(var(--u) * 5); }
  .sh-h { font-size: calc(var(--u) * 6.8); font-weight: 800; text-align: center; margin-bottom: calc(var(--u) * 3); }
  .sh-s { font-size: calc(var(--u) * 5.2); font-weight: 800; margin: calc(var(--u) * 4) 0 calc(var(--u) * 2); }
  .sh-t { font-size: calc(var(--u) * 4.6); font-weight: 600; line-height: 1.35; opacity: .85; margin: calc(var(--u) * 2) 0; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: calc(var(--u) * 2); }
  .grid.w4 { grid-template-columns: repeat(4, 1fr); }
  .cell { position: relative; aspect-ratio: 1; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; display: grid; place-items: center; background: #15161c;
    box-shadow: inset 0 calc(var(--u) * .8) 0 #0b0b10, inset 0 calc(var(--u) * -.8) 0 #2c2f3b; }
  .cell.on { background: #2b2430; box-shadow: inset 0 0 0 calc(var(--u) * .8) #d9a441; }
  .cell canvas { width: calc(var(--u) * 11); image-rendering: pixelated; }
  .grid.w4 .cell canvas { width: calc(var(--u) * 16); }
  .cell b { position: absolute; right: calc(var(--u) * 1); bottom: calc(var(--u) * .2); font-size: calc(var(--u) * 4.6); font-weight: 800; text-shadow: 0 calc(var(--u) * .5) 0 #000; }
  .cell i { position: absolute; left: calc(var(--u) * 1.2); top: calc(var(--u) * .2); font-style: normal; font-size: calc(var(--u) * 4.6); font-weight: 800; color: #ffcf7a; text-shadow: 0 calc(var(--u) * .5) 0 #000; }
  /* тайная карта (2026-11-19): золотая рамка, фиолет и плывущий туман */
  .cell.card { aspect-ratio: 3 / 4; background: linear-gradient(#2a1a46, #3b2a5c); box-shadow: inset 0 0 0 calc(var(--u) * .8) #d9a441, inset 0 0 0 calc(var(--u) * 1.6) #5a3a12; overflow: hidden; }
  .cell.card .fog { position: absolute; inset: -40%; background: radial-gradient(circle at 30% 40%, rgba(201,180,255,.55), transparent 40%), radial-gradient(circle at 70% 65%, rgba(143,106,216,.5), transparent 45%), radial-gradient(circle at 50% 20%, rgba(232,220,255,.35), transparent 35%);
    animation: fog 6s ease-in-out infinite alternate; }
  .cell.card.rare { background: linear-gradient(#1a2a46, #2a3b5c); box-shadow: inset 0 0 0 calc(var(--u) * .8) #b8d0ec, inset 0 0 0 calc(var(--u) * 1.6) #34465e; }   /* редкая — серебро и синева */
  .cell.card.rare::after { color: #e6f2ff; text-shadow: 0 0 calc(var(--u) * 2) #5a8ad8; }
  .cell.card::after { content: "?"; position: relative; font-size: calc(var(--u) * 6); font-weight: 800; color: #ffe7a3; text-shadow: 0 0 calc(var(--u) * 2) #8f6ad8; }
  @keyframes fog { 0% { transform: translate(-8%, 4%) rotate(0deg); } 100% { transform: translate(8%, -6%) rotate(25deg); } }
  /* рынок на полках с ценниками, как лавка фермы, но в цветах подземелья (его просьба 2026-11-19): железная полка с заклёпками, сланцевые ценники */
  .wares { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 2); }
  .ware { position: relative; height: calc(var(--u) * 34); display: flex; align-items: flex-end; justify-content: center; padding: 0 0 calc(var(--u) * 10); border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  .ware::after { content: ""; position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 7); height: calc(var(--u) * 3); background: linear-gradient(#6a7080, #3c404c 60%, #23262e);
    box-shadow: 0 calc(var(--u) * 1.2) 0 rgba(0, 0, 0, .45); }
  .ware:nth-child(4n + 1)::after { left: calc(var(--u) * 1.2); }
  .ware:nth-child(4n)::after, .ware:last-child::after { right: calc(var(--u) * 1.2); }
  .ware canvas { width: 64%; image-rendering: pixelated; filter: drop-shadow(0 calc(var(--u) * 1) 0 rgba(0, 0, 0, .45)); transition: transform .15s, filter .15s; }
  .ware.off canvas { opacity: .35; }                                         /* пусто — бледный (2026-11-19) */
  .ware.on canvas { transform: translateY(calc(var(--u) * -1.2)) scale(1.06); filter: drop-shadow(0 0 calc(var(--u) * 3) rgba(255, 200, 110, .8)); }
  .ware .tag { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%) rotate(-3deg); z-index: 1; padding: calc(var(--u) * .4) calc(var(--u) * 2); white-space: nowrap;
    background: #20222b; color: #ffcf7a; font-size: calc(var(--u) * 4.2); font-weight: 800; box-shadow: 0 0 0 calc(var(--u) * .6) #565b6c, 0 calc(var(--u) * .6) 0 calc(var(--u) * .6) #0b0b10; }
  .ware.on .tag { background: #d9a441; color: #4a2a0c; text-shadow: none; box-shadow: 0 0 0 calc(var(--u) * .6) #ffe7a3, 0 calc(var(--u) * .6) 0 calc(var(--u) * .6) #0b0b10; }   /* выбранный — золотая табличка, цифры коричневые, без свечения (его правка 2026-11-19) */
  .ware .sat { position: absolute; left: calc(var(--u) * 1.5); top: calc(var(--u) * 1); font-size: calc(var(--u) * 4.6); font-weight: 800; color: #ffcf7a; text-shadow: 0 calc(var(--u) * .5) 0 #000; }
  .ware .q { position: absolute; right: calc(var(--u) * 1.5); top: calc(var(--u) * 1); font-size: calc(var(--u) * 4.4); font-weight: 800; text-shadow: 0 calc(var(--u) * .5) 0 #000; }
  .ware .q.sale { color: #8fe3a8; }
  .meter { display: flex; gap: calc(var(--u) * 1); margin: calc(var(--u) * 2) 0 calc(var(--u) * 1); }
  .meter span { flex: 1; height: calc(var(--u) * 3); background: #15161c; }
  .meter em { flex: none; font-style: normal; font-size: calc(var(--u) * 3.6); font-weight: 800; color: #ffcf7a; line-height: calc(var(--u) * 3); margin-left: calc(var(--u) * 1); }
  .meter span.f { background: linear-gradient(#ffcf7a 0 50%, #d08a2a 50%); }
  .marks { display: flex; justify-content: space-between; font-size: calc(var(--u) * 4.2); font-weight: 700; opacity: .8; }
  .marks .ok { color: #8fe3a8; opacity: 1; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 3); }
  .one { display: grid; margin-top: calc(var(--u) * 3); }
  .btn { height: calc(var(--u) * 13); border: 0; color: #f2fff8; font: inherit; font-size: calc(var(--u) * 5.2); font-weight: 800; cursor: pointer; background: #3f9e7c;
    box-shadow: 0 0 0 calc(var(--u) * .8) #14151b, inset 0 calc(var(--u) * -1.2) 0 #2a7058, inset 0 calc(var(--u) * .8) 0 #6fd0a8; }
  .btn.alt { background: #3a3e4b; box-shadow: 0 0 0 calc(var(--u) * .8) #14151b, inset 0 calc(var(--u) * -1.2) 0 #23252e, inset 0 calc(var(--u) * .8) 0 #5a5f70; color: var(--cream); }
  .btn:disabled { opacity: .45; }
  .btn:active { filter: brightness(1.2); }
  /* окно котла — в стиле перегонного куба с его фона (2026-11-19): кованое железо с заклёпками, стеклянные колбы, зелёная светящаяся жижа */
  #sheetbox.cube { background: linear-gradient(#232b2a, #161c1c 60%, #121616); clip-path: none;
    box-shadow: 0 0 0 calc(var(--u) * .8) #0a0d0d, inset 0 calc(var(--u) * .8) 0 #46524f, inset 0 calc(var(--u) * -1) 0 #0b0f0f, 0 0 calc(var(--u) * 10) rgba(80, 230, 120, .18);
    background-image: radial-gradient(circle at calc(var(--u) * 3) calc(var(--u) * 3), #5b6a66 calc(var(--u) * .9), transparent calc(var(--u) * 1.1)),
      radial-gradient(circle at calc(100% - var(--u) * 3) calc(var(--u) * 3), #5b6a66 calc(var(--u) * .9), transparent calc(var(--u) * 1.1)),
      radial-gradient(circle at calc(var(--u) * 3) calc(100% - var(--u) * 3), #5b6a66 calc(var(--u) * .9), transparent calc(var(--u) * 1.1)),
      radial-gradient(circle at calc(100% - var(--u) * 3) calc(100% - var(--u) * 3), #5b6a66 calc(var(--u) * .9), transparent calc(var(--u) * 1.1)),
      linear-gradient(#232b2a, #161c1c 60%, #121616); }
  #sheetbox.cube .sh-h { color: #b9f7c4; text-shadow: 0 0 calc(var(--u) * 3) rgba(90, 240, 130, .55); }
  #sheetbox.cube .sh-t { color: #9fc8a9; }
  #sheetbox.cube .brew .cell { background: linear-gradient(rgba(70, 200, 110, .10), rgba(40, 140, 80, .22)), #0f1514;
    box-shadow: inset 0 0 0 calc(var(--u) * .8) #3c4a47, inset 0 calc(var(--u) * 1.2) 0 rgba(200, 255, 220, .10), inset 0 calc(var(--u) * -4) calc(var(--u) * 3) rgba(70, 230, 120, .25); }
  #sheetbox.cube .brew .arrow { position: relative; width: calc(var(--u) * 12); height: calc(var(--u) * 4); background: #2c3634; box-shadow: inset 0 calc(var(--u) * .7) 0 #55625f, inset 0 calc(var(--u) * -.7) 0 #0b0f0f; }
  #sheetbox.cube .brew .arrow::after { content: ""; position: absolute; right: calc(var(--u) * -3); top: calc(var(--u) * -1.5); border: calc(var(--u) * 3.5) solid transparent; border-left-color: #55625f; border-right: 0; }
  #sheetbox.cube .brew .arrow i { position: absolute; left: 0; right: 0; top: 30%; bottom: 30%; background: repeating-linear-gradient(90deg, #5ee07e 0 calc(var(--u) * 2), #2f9a52 calc(var(--u) * 2) calc(var(--u) * 4));
    background-size: calc(var(--u) * 4) 100%; animation: flow 0.7s linear infinite; box-shadow: 0 0 calc(var(--u) * 2) rgba(90, 240, 130, .7); }
  @keyframes flow { to { background-position: calc(var(--u) * 4) 0; } }
  #sheetbox.cube .btn { background: linear-gradient(#58d37c, #2f9a52); box-shadow: 0 0 0 calc(var(--u) * .8) #0a0d0d, inset 0 calc(var(--u) * -1.2) 0 #1f6a3a, inset 0 calc(var(--u) * .8) 0 #a6f7bd, 0 0 calc(var(--u) * 4) rgba(90, 240, 130, .35); color: #062010; }
  #sheetbox.cube .btn.alt { background: #2c3634; box-shadow: 0 0 0 calc(var(--u) * .8) #0a0d0d, inset 0 calc(var(--u) * -1.2) 0 #161c1c, inset 0 calc(var(--u) * .8) 0 #55625f; color: #b9f7c4; }
  #sheetbox.cube .step .num { color: #b9f7c4; text-shadow: 0 0 calc(var(--u) * 2) rgba(90, 240, 130, .5); }
  #sheetbox.cube .prog { height: calc(var(--u) * 5); background: #0f1514; box-shadow: inset 0 0 0 calc(var(--u) * .8) #3c4a47, inset 0 calc(var(--u) * 1) 0 rgba(200, 255, 220, .12); position: relative; overflow: hidden; }
  #sheetbox.cube .prog i { background: linear-gradient(#7ef0a0, #2f9a52); box-shadow: 0 0 calc(var(--u) * 3) rgba(90, 240, 130, .6);
    background-image: radial-gradient(circle at 20% 60%, rgba(220,255,230,.7) calc(var(--u) * .6), transparent calc(var(--u) * .8)), radial-gradient(circle at 60% 40%, rgba(220,255,230,.6) calc(var(--u) * .5), transparent calc(var(--u) * .7)), linear-gradient(#7ef0a0, #2f9a52);
    background-size: calc(var(--u) * 10) 100%, calc(var(--u) * 14) 100%, 100% 100%; animation: bub 2.4s linear infinite; }
  @keyframes bub { to { background-position: calc(var(--u) * 10) 0, calc(var(--u) * -14) 0, 0 0; } }
  .brew { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: calc(var(--u) * 3); width: 62%; margin: 0 auto; }
  .brew .cell { cursor: default; }
  .brew .cell canvas { width: calc(var(--u) * 20); }
  .brew .arrow { font-size: calc(var(--u) * 8); font-weight: 800; color: #ffcf7a; }
  .sh-t.c { text-align: center; }
  .step { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 3); align-items: center; }
  .step .num { text-align: center; font-size: calc(var(--u) * 7); font-weight: 800; }
  .step .btn { font-size: calc(var(--u) * 6); }
  .prog { height: calc(var(--u) * 3); background: #15161c; margin: calc(var(--u) * 2) 0; }
  .prog i { display: block; height: 100%; background: linear-gradient(#8fe3a8 0 50%, #3f9e7c 50%); }
  .tag { position: absolute; transform: translate(-50%, -100%); font-size: calc(var(--u) * 3.6); font-weight: 800; letter-spacing: .03em; text-transform: lowercase; color: #f4ead0; text-shadow: 0 0 calc(var(--u) * 1.5) #000, 0 calc(var(--u) * .6) 0 #000; pointer-events: none; white-space: nowrap; }
  .tag.brewt { color: #7dffa2; text-transform: none; text-shadow: 0 0 calc(var(--u) * 2) rgba(60, 230, 110, .9), 0 0 calc(var(--u) * 1.5) #000, 0 calc(var(--u) * .6) 0 #000; font-variant-numeric: tabular-nums; }   /* таймер куба — зелёный, как жижа */
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" width="144" height="256"></canvas>
  <canvas id="herol" width="941" height="1672"></canvas>

    var wait = !!D && !!dgCall && !fresh; if (wait) $("pickneed").textContent = "Проверяю рюкзак…";   // 2026-11-19: из памяти пустило в поход без еды
    if (live) $("resumes").textContent = { s: "малое", m: "среднее", l: "большое" }[D.size] + " · уже оплачен" + (D.secret ? " · тайная комната" : "");
    pick.querySelectorAll("button[data-size]").forEach(function (b) { var z = b.dataset.size; b.disabled = wait || (!!brew && z !== "l") || (!!D && !D.free && (z === "l" ? sat : sat - brew) < D.need[z]);   // похлёбка в рюкзаке — открыто только большое (его правка 2026-11-20)   // проба хозяина (D.free) — без еды
      var sm = b.querySelector("small"); if (!sm.dataset.t) sm.dataset.t = sm.textContent; sm.textContent = sm.dataset.t + (z === "l" && brew ? " · тайная комната" : ""); });
  }
  // переход в бой — только если страница боя отвечает (2026-11-19: GitHub, где лежит сайт, сбоил — вместо боя открывалась его ошибка 404,
  // а поход уже был оплачен). Не ответила — ещё две попытки, потом остаёмся в убежище; начатый поход можно продолжить
  function goBattle(url) {
    var tries = 0;
    (function attempt() {
      fetch("iso.html?probe=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; location.href = url; })
        .catch(function () { if (++tries < 3) return setTimeout(attempt, 900);
          tell("Сайт игр не ответил — попробуй ещё раз. Поход сохранён"); pick.classList.remove("on"); load(); });
    })();
  }
  // вернулись «назад» с ошибки — браузер показывает убежище из памяти, с выключенными кнопками: перечитать заново
  addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
  pick.firstElementChild.appendChild(shx(function () { pick.classList.remove("on"); }));   // крестик выбора подземелья — свой обработчик, мимо кнопок спуска
  pick.addEventListener("click", function (e) { e.stopPropagation(); var b = e.target.closest("button"); if (!b || b.classList.contains("shx")) { pick.classList.remove("on"); return; }
    if (b.id === "srtest") { pick.querySelectorAll("button").forEach(function (x) { x.disabled = true; }); goBattle("iso.html?size=l&pay=1&sr=1&v=" + Date.now()); return; }
    if (b.id === "resume") { b.disabled = true; goBattle("iso.html?size=" + D.size + "&run=" + D.run + (D.secret ? "&secret=1" : "") + (D.revive ? "&rv=" + D.revive : "") + "&v=" + Date.now()); return; }   // уже оплачен — без новой еды
    if (!dgCall) { location.href = "iso.html?size=" + b.dataset.size + "&v=" + Date.now(); return; }
    pick.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
    goBattle("iso.html?size=" + b.dataset.size + "&pay=1&v=" + Date.now());   // еду спишет страница боя, когда откроется (2026-11-19)
  });
  document.querySelectorAll(".act").forEach(function (bn) { bn.addEventListener("click", function (e) { e.stopPropagation();
    if (bn.classList.contains("go")) { if (D && D.run) { hide(); pickView(); pick.classList.add("on"); return; } if (D && D.hp <= 0) return show(hpView), tell("Герою нужно подлечиться"); if (D && !D.sat && !D.free) return show(packView), tell("Положи еду в рюкзак"); hide(); pickView(); pick.classList.add("on"); return; }
    var fn = bn.dataset.sheet === "pack" ? packView : marketView; if (open === fn) return hide(); if (fn === marketView) mRefresh(); show(fn); }); });   // второе нажатие закрывает
  if (D) hud(); load(); mRefresh();                                             // из памяти — сразу, свежее с сервера — следом; рынок — заранее
  document.getElementById("gear").addEventListener("click", function (e) { e.stopPropagation(); tell("Настройки — будут позже"); });
  cv.addEventListener("pointerdown", function (e) {
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;   // доли экрана — места на его фоне
    if (x > .12 && x < .40 && y > .28 && y < .60) return show(brewView);
    if (x > .63 && x < .92 && y > .33 && y < .62) return tell("Кузница — будет позже");
    if (x > .40 && x < .63 && y > .32 && y < .59) return document.querySelector(".act.go").click();
  });
})();
</script>
