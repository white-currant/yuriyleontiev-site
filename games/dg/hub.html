<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Подземелье — прототип</title>
<style>
  :root { --u: 2.6px; --ink: #0b0a10; --slate: #20222b; --slate2: #2c2f3b; --edge: #565b6c; --edge2: #14151b; --cream: #efe6d2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; }
  body { display: grid; place-items: center; font-family: -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; color: var(--cream); }
  #stage { position: relative; width: min(100vw, calc(100vh * 144 / 256)); aspect-ratio: 144 / 256; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #scene, #herol { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #herol { pointer-events: none; }
  /* убежище — его фон (2026-11-17), мой нарисованный выключен; герой стоит крупно в центре */
  #stage { background: #07060a url(hub-bg.webp) center / 100% 100% no-repeat; }
  #scene { opacity: 0; }
  canvas.ic { image-rendering: pixelated; display: block; flex: none; }
  /* панели интерфейса: тёмный сланец, рамка со срезанными углами */
  .pan { background: var(--slate); box-shadow: 0 0 0 var(--u) var(--edge2), inset 0 var(--u) 0 var(--edge), inset 0 calc(var(--u) * -1) 0 #16171d, inset var(--u) 0 0 #3a3e4b, inset calc(var(--u) * -1) 0 0 #16171d;
    clip-path: polygon(var(--u) 0, calc(100% - var(--u)) 0, 100% var(--u), 100% calc(100% - var(--u)), calc(100% - var(--u)) 100%, var(--u) 100%, 0 calc(100% - var(--u)), 0 var(--u)); }
  #top { position: absolute; left: calc(var(--u) * 4); right: calc(var(--u) * 4); top: calc(var(--u) * 4 + env(safe-area-inset-top)); display: flex; align-items: flex-start; gap: calc(var(--u) * 3); }
  #face { width: calc(var(--u) * 22); height: calc(var(--u) * 22); display: grid; place-items: center; }
  #bars { display: grid; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 1); }
  .bar { position: relative; width: calc(var(--u) * 44); height: calc(var(--u) * 9); display: flex; align-items: center; }
  .bar canvas { position: absolute; left: calc(var(--u) * -1); z-index: 2; }
  .bar .fill { position: absolute; left: calc(var(--u) * 7); right: calc(var(--u) * 1.5); top: calc(var(--u) * 1.5); bottom: calc(var(--u) * 1.5); background: #15161c; }
  .bar .fill i { display: block; height: 100%; }
  button.bar { border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  .bar.hp .fill i { background: linear-gradient(#e2574b 0 45%, #b8322c 45%); }
  .bar.en .fill i { background: linear-gradient(#58a9ee 0 45%, #2f6fb8 45%); }
  .bar b { position: relative; z-index: 3; width: 100%; padding-left: calc(var(--u) * 7); text-align: center; font-size: calc(var(--u) * 4.4); font-weight: 800; letter-spacing: .02em; text-shadow: 0 calc(var(--u) * .6) 0 rgba(0, 0, 0, .7); }
  #res { margin-left: auto; display: grid; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 1); }
  .cnt { width: calc(var(--u) * 34); height: calc(var(--u) * 9); display: flex; align-items: center; gap: calc(var(--u) * 3); padding: 0 calc(var(--u) * 3); font-size: calc(var(--u) * 4.6); font-weight: 800; }
  #gear { width: calc(var(--u) * 15); height: calc(var(--u) * 15); display: grid; place-items: center; margin-top: calc(var(--u) * 1); border: 0; padding: 0; color: inherit; }
  #bottom { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 6 + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: calc(var(--u) * 6); }
  .act { width: calc(var(--u) * 24); height: calc(var(--u) * 24); display: grid; place-items: center; border: 0; padding: 0; color: inherit; cursor: pointer; transition: transform .06s; }
  .act:active { transform: translateY(var(--u)); filter: brightness(1.25); }
  .act.go { background: #2b2430; box-shadow: 0 0 0 var(--u) var(--edge2), inset 0 var(--u) 0 #8a6a4a, inset 0 calc(var(--u) * -1) 0 #16171d, inset var(--u) 0 0 #5a4636, inset calc(var(--u) * -1) 0 0 #16171d; }
  #say { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); max-width: 84%; padding: calc(var(--u) * 3) calc(var(--u) * 5); font-size: calc(var(--u) * 4.6); font-weight: 700; line-height: 1.3; text-align: center;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  #say.on { opacity: 1; }
  #say { z-index: 5; }
  /* выбор подземелья (его решение 2026-11-19): размер и плата едой — «сытость» = очки блюда */
  #pick { position: absolute; inset: 0; display: none; place-items: center; background: rgba(6, 5, 9, .55); }
  #pick.on { display: grid; }
  #pick > div { width: 74%; padding: calc(var(--u) * 5); display: grid; gap: calc(var(--u) * 3); text-align: center; }
  #pick p { margin: 0 0 calc(var(--u) * 1); font-size: calc(var(--u) * 5); font-weight: 800; }
  #pick button { height: calc(var(--u) * 15); border: 0; color: inherit; font: inherit; font-size: calc(var(--u) * 4.4); font-weight: 800; cursor: pointer; display: grid; place-items: center; line-height: 1.15; }
  #pick button small { display: block; font-size: calc(var(--u) * 3.4); font-weight: 600; opacity: .75; }
  #pick button:active { filter: brightness(1.25); }
  #pick button:disabled { opacity: .45; }
  #pick .need { font-size: calc(var(--u) * 3.6); font-weight: 600; opacity: .8; margin-top: calc(var(--u) * -1); }
  /* окна убежища (2026-11-19): рюкзак, рынок, котёл — снизу, над кнопками */
  #sheet { position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--u) * 32 + env(safe-area-inset-bottom)); display: none; align-items: flex-end; justify-content: center; background: rgba(6, 5, 9, .6); }
  #sheet.on { display: flex; }
  #sheetbox { width: calc(100% - var(--u) * 8); max-height: 74%; overflow-y: auto; margin-bottom: calc(var(--u) * 3); padding: calc(var(--u) * 5); }
  .sh-h { font-size: calc(var(--u) * 5.4); font-weight: 800; text-align: center; margin-bottom: calc(var(--u) * 3); }
  .sh-s { font-size: calc(var(--u) * 4); font-weight: 800; margin: calc(var(--u) * 4) 0 calc(var(--u) * 2); }
  .sh-t { font-size: calc(var(--u) * 3.6); font-weight: 600; line-height: 1.35; opacity: .78; margin: calc(var(--u) * 2) 0; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: calc(var(--u) * 2); }
  .grid.w4 { grid-template-columns: repeat(4, 1fr); }
  .cell { position: relative; aspect-ratio: 1; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; display: grid; place-items: center; background: #15161c;
    box-shadow: inset 0 calc(var(--u) * .8) 0 #0b0b10, inset 0 calc(var(--u) * -.8) 0 #2c2f3b; }
  .cell.on { background: #2b2430; box-shadow: inset 0 0 0 calc(var(--u) * .8) #d9a441; }
  .cell canvas { width: calc(var(--u) * 11); image-rendering: pixelated; }
  .grid.w4 .cell canvas { width: calc(var(--u) * 16); }
  .cell b { position: absolute; right: calc(var(--u) * 1); bottom: calc(var(--u) * .4); font-size: calc(var(--u) * 3.2); font-weight: 800; text-shadow: 0 calc(var(--u) * .5) 0 #000; }
  .cell i { position: absolute; left: calc(var(--u) * 1); top: calc(var(--u) * .4); font-style: normal; font-size: calc(var(--u) * 3); font-weight: 800; color: #ffcf7a; text-shadow: 0 calc(var(--u) * .5) 0 #000; }
  /* тайная карта (2026-11-19): золотая рамка, фиолет и плывущий туман */
  .cell.card { aspect-ratio: 3 / 4; background: linear-gradient(#2a1a46, #3b2a5c); box-shadow: inset 0 0 0 calc(var(--u) * .8) #d9a441, inset 0 0 0 calc(var(--u) * 1.6) #5a3a12; overflow: hidden; }
  .cell.card .fog { position: absolute; inset: -40%; background: radial-gradient(circle at 30% 40%, rgba(201,180,255,.55), transparent 40%), radial-gradient(circle at 70% 65%, rgba(143,106,216,.5), transparent 45%), radial-gradient(circle at 50% 20%, rgba(232,220,255,.35), transparent 35%);
    animation: fog 6s ease-in-out infinite alternate; }
  .cell.card::after { content: "?"; position: relative; font-size: calc(var(--u) * 6); font-weight: 800; color: #ffe7a3; text-shadow: 0 0 calc(var(--u) * 2) #8f6ad8; }
  @keyframes fog { 0% { transform: translate(-8%, 4%) rotate(0deg); } 100% { transform: translate(8%, -6%) rotate(25deg); } }
  .meter { display: flex; gap: calc(var(--u) * 1); margin: calc(var(--u) * 2) 0 calc(var(--u) * 1); }
  .meter span { flex: 1; height: calc(var(--u) * 3); background: #15161c; }
  .meter span.f { background: linear-gradient(#ffcf7a 0 50%, #d08a2a 50%); }
  .marks { display: flex; justify-content: space-between; font-size: calc(var(--u) * 3.2); font-weight: 700; opacity: .8; }
  .marks .ok { color: #8fe3a8; opacity: 1; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 3); }
  .one { display: grid; margin-top: calc(var(--u) * 3); }
  .btn { height: calc(var(--u) * 13); border: 0; color: #f2fff8; font: inherit; font-size: calc(var(--u) * 4); font-weight: 800; cursor: pointer; background: #3f9e7c;
    box-shadow: 0 0 0 calc(var(--u) * .8) #14151b, inset 0 calc(var(--u) * -1.2) 0 #2a7058, inset 0 calc(var(--u) * .8) 0 #6fd0a8; }
  .btn.alt { background: #3a3e4b; box-shadow: 0 0 0 calc(var(--u) * .8) #14151b, inset 0 calc(var(--u) * -1.2) 0 #23252e, inset 0 calc(var(--u) * .8) 0 #5a5f70; color: var(--cream); }
  .btn:disabled { opacity: .45; }
  .btn:active { filter: brightness(1.2); }
  .prog { height: calc(var(--u) * 3); background: #15161c; margin: calc(var(--u) * 2) 0; }
  .prog i { display: block; height: 100%; background: linear-gradient(#8fe3a8 0 50%, #3f9e7c 50%); }
  .tag { position: absolute; transform: translate(-50%, -100%); font-size: calc(var(--u) * 3.6); font-weight: 800; letter-spacing: .03em; text-transform: lowercase; color: #f4ead0; text-shadow: 0 0 calc(var(--u) * 1.5) #000, 0 calc(var(--u) * .6) 0 #000; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" width="144" height="256"></canvas>
  <canvas id="herol" width="941" height="1672"></canvas>
  <div class="tag" style="left:27%;top:27%">перегонный куб</div>
  <div class="tag" style="left:77%;top:32%">кузница</div>
  <div id="top">
    <div id="face" class="pan"><canvas class="ic" id="i-face" width="18" height="18"></canvas></div>
    <div id="bars">
      <button class="bar hp pan" id="hpbar" type="button" aria-label="Здоровье"><canvas class="ic" id="i-heart" width="11" height="10"></canvas><div class="fill"><i id="hpfill" style="width:100%"></i></div><b id="hptext">100 / 100</b></button>
    </div>
    <div id="res">
      <div class="cnt pan"><canvas class="ic" id="i-bone" width="12" height="11"></canvas><span id="nbone">0</span></div>
      <div class="cnt pan"><canvas class="ic" id="i-leaf" width="11" height="10"></canvas><span id="nfert">0</span></div>
    </div>
    <button id="gear" class="pan" type="button" aria-label="Настройки"><canvas class="ic" id="i-gear" width="11" height="11"></canvas></button>
  </div>
  <div id="bottom">
    <button class="act pan" type="button" data-sheet="pack" aria-label="Рюкзак"><canvas class="ic" id="i-bag" width="16" height="16"></canvas></button>
    <button class="act pan" type="button" data-sheet="market" aria-label="Рынок"><canvas class="ic" id="i-shop" width="16" height="16"></canvas></button>
    <button class="act pan go" type="button" aria-label="В подземелье"><canvas class="ic" id="i-swords" width="16" height="16"></canvas></button>
  </div>
  <div id="say" class="pan"></div>
  <div id="pick"><div class="pan"><p>Куда спускаемся?</p>
    <div class="need" id="pickneed"></div>
    <button class="pan" type="button" data-size="s">Малое<small>3–4 зала · сытость 1</small></button>
    <button class="pan" type="button" data-size="m">Среднее<small>6–8 залов · сытость 2</small></button>
    <button class="pan" type="button" data-size="l">Большое<small>10–12 залов · сытость 4</small></button>
  </div></div>
  <div id="sheet"><div class="pan" id="sheetbox"></div></div>
</div>
<script>
(function () {
  var W = 144, H = 256, FLOOR = 122;
  var stage = document.getElementById("stage"), cv = document.getElementById("scene"), ctx = cv.getContext("2d");
  function fit() { stage.style.setProperty("--u", stage.clientWidth / W + "px"); document.documentElement.style.setProperty("--u", stage.clientWidth / W + "px"); }
  fit(); addEventListener("resize", fit);

  // ---------- маленькие помощники ----------
  function rng(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function px(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); }
  function sprite(c, x, y, rows, pal) {
    for (var j = 0; j < rows.length; j++) for (var i = 0; i < rows[j].length; i++) { var ch = rows[j][i]; if (ch !== "." && pal[ch]) px(c, x + i, y + j, 1, 1, pal[ch]); }
  }
  function icon(id, rows, pal, scale) {
    var c = document.getElementById(id); if (!c) return; var g = c.getContext("2d"); c.width = rows[0].length; c.height = rows.length; sprite(g, 0, 0, rows, pal); size(c, scale || 1);
  }
  function size(c, k) { c.style.width = "calc(var(--u) * " + c.width * k + ")"; c.style.height = "calc(var(--u) * " + c.height * k + ")"; }
  // камень: округлое пятно со светом сверху-слева и тенью снизу
  function rock(c, x, y, w, h, base, hi, lo) {
    for (var j = 0; j < h; j++) {
      var t = (j + .5) / h, half = Math.sqrt(Math.max(0, 1 - Math.pow(t * 2 - 1, 2))) * w / 2, cut = j < h * .22 ? 1 : 0;
      var x0 = Math.round(x + w / 2 - half) + cut, x1 = Math.round(x + w / 2 + half) - cut;
      if (x1 <= x0) continue;
      px(c, x0, y + j, x1 - x0, 1, j > h * .68 ? lo : base);
      if (j < h * .34) px(c, x0 + 1, y + j, Math.max(1, Math.round((x1 - x0) * .45)), 1, hi);
    }
  }

  // ---------- неподвижная сцена (без света) ----------
  var base = document.createElement("canvas"); base.width = W; base.height = H; var b = base.getContext("2d");
  (function drawBase() {
    var r = rng(4711), i, x, y;
    // задняя стена пещеры
    px(b, 0, 0, W, FLOOR, "#3a3644");
    for (i = 0; i < 260; i++) { x = r() * W; y = r() * FLOOR; var ww = 3 + r() * 9, hh = 2 + r() * 5, d = r();
      px(b, x, y, ww, hh, d < .5 ? "#332f3d" : d < .8 ? "#423d4d" : "#2c2935"); if (d > .8) px(b, x, y, ww, 1, "#4d4859"); }
    for (i = 0; i < 26; i++) { x = r() * W; y = 20 + r() * (FLOOR - 26); var len = 4 + r() * 10; for (var k = 0; k < len; k++) px(b, x + k * (r() < .5 ? 1 : .4), y + k, 1, 1, "#231f2b"); }   // трещины
    // потолок и сталактиты
    px(b, 0, 0, W, 9, "#1c1a24");
    for (x = 0; x < W; ) { var sw = 5 + Math.floor(r() * 9), sh = 6 + Math.floor(r() * 20) * (r() < .35 ? 1 : .45);
      for (var j2 = 0; j2 < sh; j2++) { var half2 = (sw / 2) * (1 - j2 / sh); px(b, x + sw / 2 - half2, 9 + j2, Math.max(1, Math.round(half2 * 2)), 1, "#1c1a24"); px(b, x + sw / 2 - half2, 9 + j2, 1, 1, "#2b2835"); }
      x += sw - 1; }
    // проход в глубину — тёмная арка с деревянной рамой
    for (y = 58; y < FLOOR; y++) { var aw = y < 70 ? 10 * Math.sqrt(1 - Math.pow((70 - y) / 12, 2)) : 10; px(b, 72 - aw, y, aw * 2, 1, "#0a090e"); }
    px(b, 60, 66, 2, FLOOR - 66, "#5b4028"); px(b, 82, 66, 2, FLOOR - 66, "#5b4028"); px(b, 60, 66, 1, FLOOR - 66, "#7a5836");
    px(b, 58, 62, 28, 3, "#6a4b2e"); px(b, 58, 62, 28, 1, "#8a6540"); px(b, 58, 65, 28, 1, "#3d2a1a");
    for (i = 0; i < 4; i++) px(b, 64 + i * 4, 110 + i * 3, 16 - i * 2, 3, i % 2 ? "#17151d" : "#1f1c26");   // ступени вниз

    // пол
    px(b, 0, FLOOR, W, H - FLOOR, "#3b3331");
    for (y = FLOOR; y < H; y++) for (x = 0; x < W; x++) {
      var e = Math.pow((x - 72) / 62, 2) + Math.pow((y - 178) / 74, 2), n = r();
      if (e < 1 - n * .25) px(b, x, y, 1, 1, n < .08 ? "#5a4f47" : n < .5 ? "#4d433d" : "#473e39");
      else if (n < .1) px(b, x, y, 1, 1, "#332c2b");
    }
    px(b, 0, FLOOR, W, 2, "#221e22"); px(b, 0, FLOOR + 2, W, 1, "#2e2829");                        // тень под стеной
    for (i = 0; i < 46; i++) { x = 8 + r() * 128; y = FLOOR + 8 + r() * (H - FLOOR - 14); var pw = 2 + Math.floor(r() * 5);
      px(b, x, y, pw, 1, "#665a50"); px(b, x, y + 1, pw, 1, "#2f2928"); if (pw > 3) px(b, x + 1, y - 1, pw - 2, 1, "#74675b"); }   // камушки
    for (i = 0; i < 14; i++) { x = 14 + r() * 116; y = FLOOR + 10 + r() * 100; for (k = 0; k < 5 + r() * 7; k++) px(b, x + k, y + Math.round(Math.sin(k) * 1), 1, 1, "#2c2625"); }

    // валуны по краям
    var edge = [[-6, 96, 22, 30], [-4, 120, 16, 22], [-8, 150, 20, 26], [-5, 200, 22, 30], [128, 92, 22, 32], [132, 126, 18, 22], [130, 156, 20, 22], [126, 226, 24, 34], [-6, 232, 30, 30], [34, 246, 30, 16], [84, 248, 34, 14]];
    edge.forEach(function (q) { rock(b, q[0], q[1], q[2], q[3], "#3e3a48", "#565164", "#252230"); });

    // ----- перегонный куб: из костей монстров — удобрение -----
    var mx = 22;
    px(b, 6, 104, 16, 18, "#5a3f28"); px(b, 6, 104, 16, 2, "#7a5836"); px(b, 6, 112, 16, 1, "#3d2a1a"); px(b, 6, 104, 1, 18, "#7a5836"); px(b, 21, 104, 1, 18, "#3d2a1a");   // ящик с костями
    px(b, 9, 107, 10, 1, "#3d2a1a"); px(b, 9, 116, 10, 1, "#3d2a1a");
    sprite(b, 7, 99, ["..w...ww..", ".wWw.wWWw.", "wWWWwWWw..", ".wwWWWw...", "...www...."], { w: "#8f8873", W: "#e9e2cf" });
    px(b, 14, 92, 3, 14, "#5b606b"); px(b, 14, 92, 1, 14, "#7d838f"); px(b, 14, 90, 9, 3, "#5b606b"); px(b, 14, 90, 9, 1, "#7d838f"); px(b, 13, 97, 5, 2, "#3c4049");   // труба к ящику
    px(b, mx + 4, 60, 26, 2, "#8b909b"); for (i = 0; i < 6; i++) px(b, mx + 5 + i, 62 + i, 24 - i * 2, 1, i < 2 ? "#70757f" : "#5b606b");   // воронка
    px(b, mx + 4, 60, 26, 1, "#aab0bb"); px(b, mx + 14, 68, 6, 6, "#4a4e57"); px(b, mx + 14, 68, 2, 6, "#6b707a");
    sprite(b, mx + 6, 52, ["....w...W.....", "...wWw.wWw.rr.", ".rrwWWwWWwrRRr", "rRRrwWWWwrRRRr", "rRRRrwwwrRRRr.", ".rrrr...rrrr.."], { w: "#8f8873", W: "#e9e2cf", r: "#6e2420", R: "#a8372e" });
    px(b, mx - 1, 74, 36, 4, "#4a4e57"); px(b, mx - 1, 74, 36, 1, "#7d838f"); px(b, mx - 1, 77, 36, 1, "#2a2d34");
    for (i = 0; i < 6; i++) px(b, mx + 1 + i * 6, 75, 1, 1, "#aab0bb");
    px(b, mx, 78, 34, 24, "#101a14"); px(b, mx, 78, 2, 24, "#3c4049"); px(b, mx + 32, 78, 2, 24, "#2a2d34");                 // стеклянный бак (жидкость рисуется отдельно)

  // котёл: 40 костей — одно удобрение, варятся по очереди по 30 минут; готовое само ложится в амбар
  function brewView() {
    head("Перегонный куб"); if (!D) return noServer();
    var br = D.brew, nowS = Date.now() / 1000 - D.t0, left = br.n ? br.per - ((nowS - br.started) % br.per) : 0, can = Math.min(Math.floor(D.bones / br.bones), br.max - br.n);
    if (br.n && nowS - br.started >= br.per) { load(); }
    box.appendChild(el("div", "sh-t", "Костей: " + D.bones + ". Из " + br.bones + " костей выходит одно удобрение за " + Math.round(br.per / 60) + " минут. Готовое само ложится в амбар фермы, оттуда его можно выставить на рынок."));
    if (br.n) {
      box.appendChild(el("div", "sh-s", "Варится: " + br.n));
      var pg = el("div", "prog"), pi = el("i"); pi.style.width = Math.round((1 - left / br.per) * 100) + "%"; pg.appendChild(pi); box.appendChild(pg);
      box.appendChild(el("div", "sh-t", "Следующее через " + Math.floor(left / 60) + ":" + String(Math.floor(left % 60)).padStart(2, "0") + (br.n > 1 ? ", все — через " + Math.ceil((left + (br.n - 1) * br.per) / 60) + " мин" : "")));
    }
    if (D.got) { box.appendChild(el("div", "sh-t", "Готово и уже в амбаре: " + D.got)); D.got = 0; }
    var two = el("div", "two"), b1 = el("button", "btn", "Переплавить 1"), b2 = el("button", "btn alt", "Всё — " + Math.max(can, 0));
    b1.type = b2.type = "button"; b1.disabled = can < 1; b2.disabled = can < 2;
    var go = function (n) { return function (e) { e.stopPropagation(); D.bones -= n * br.bones; if (!br.n) br.started = Date.now() / 1000 - D.t0; br.n += n; hud(); brewView(); apply(dgCall("/api/dg/brew", { n: n })); }; };
    b1.onclick = go(1); b2.onclick = go(can); two.appendChild(b1); two.appendChild(b2); box.appendChild(two);
    if (!D.barn) box.appendChild(el("div", "sh-t", "Сначала построй амбар на ферме: удобрение ложится в него."));
    clearInterval(tick); tick = setInterval(function () { if (open === brewView) brewView(); else clearInterval(tick); }, 1000);
  }

  // спуск: размер и плата едой из рюкзака
  function pickView() {                                // Странная похлёбка — только в большое (его решение 2026-11-19): в малом и среднем её сытость не считается
    var sat = D ? D.sat : 0, brew = D ? D.pack.filter(function (p) { return rec(p.item) === "brew"; }).reduce(function (a, p) { return a + p.sat; }, 0) : 0;
    $("pickneed").textContent = D ? "В рюкзаке сытость " + sat + (brew ? " — со Странной похлёбкой только в большое" : "") : "Пробный спуск — без фермы еда не нужна";
    pick.querySelectorAll("button").forEach(function (b) { var z = b.dataset.size; b.disabled = !!D && (z === "l" ? sat : sat - brew) < D.need[z];
      var sm = b.querySelector("small"); if (!sm.dataset.t) sm.dataset.t = sm.textContent; sm.textContent = sm.dataset.t + (z === "l" && brew ? " · тайная комната" : ""); });
  }
  pick.addEventListener("click", function (e) { e.stopPropagation(); var b = e.target.closest("button"); if (!b) { pick.classList.remove("on"); return; }
    if (!dgCall) { location.href = "iso.html?size=" + b.dataset.size + "&v=" + Date.now(); return; }
    pick.querySelectorAll("button").forEach(function (x) { x.disabled = true; }); b.lastChild.textContent = "спускаюсь…";
    dgCall("/api/dg/start", { size: b.dataset.size }).then(function (r) {
      if (r.error) { tell(r.error); pick.classList.remove("on"); return load(); }
      location.href = "iso.html?size=" + r.size + "&run=" + r.run + (r.secret ? "&secret=1" : "") + "&v=" + Date.now();
    }).catch(function (e2) { tell(e2.message); pick.classList.remove("on"); });
  });
  document.querySelectorAll(".act").forEach(function (bn) { bn.addEventListener("click", function (e) { e.stopPropagation();
    if (bn.classList.contains("go")) { if (D && D.hp <= 0) return show(hpView), tell("Герою нужно подлечиться"); if (D && !D.sat) return show(packView), tell("Положи еду в рюкзак"); pickView(); pick.classList.add("on"); return; }
    var fn = bn.dataset.sheet === "pack" ? packView : marketView; if (open === fn) return hide(); if (fn === marketView) M = null; show(fn); }); });   // второе нажатие закрывает
  load();
  document.getElementById("gear").addEventListener("click", function (e) { e.stopPropagation(); tell("Настройки"); });
  cv.addEventListener("pointerdown", function (e) {
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;   // доли экрана — места на его фоне
    if (x > .12 && x < .40 && y > .28 && y < .60) return show(brewView);
    if (x > .63 && x < .92 && y > .33 && y < .62) return tell("Кузница: оружие и починка");
    if (x > .40 && x < .63 && y > .32 && y < .59) return document.querySelector(".act.go").click();
  });
})();
</script>
</body>
