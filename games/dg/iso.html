<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Подземелье — изометрия</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; }
  body { display: grid; place-items: center; font-family: -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; color: #efe6d2; }
  #stage { --u: 1px; position: relative; width: min(100vw, calc(100vh * 216 / 384)); aspect-ratio: 216 / 384; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .pan { background: #20222b; box-shadow: 0 0 0 calc(var(--u) * 2) #14151b, inset 0 calc(var(--u) * 2) 0 #565b6c, inset 0 calc(var(--u) * -2) 0 #16171d; }
  #hud { position: absolute; left: calc(var(--u) * 10); right: calc(var(--u) * 10); top: calc(var(--u) * 10 + env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  #hp { position: relative; width: calc(var(--u) * 120); height: calc(var(--u) * 20); }
  #hp i { position: absolute; left: calc(var(--u) * 4); top: calc(var(--u) * 4); bottom: calc(var(--u) * 4); width: calc(100% - var(--u) * 8); background: linear-gradient(#e2574b 0 45%, #b8322c 45%); transform-origin: left; }
  #hp b { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--u) * 11); font-weight: 800; text-shadow: 0 var(--u) 0 rgba(0, 0, 0, .7); }
  #bones { padding: 0 calc(var(--u) * 10); height: calc(var(--u) * 20); display: flex; align-items: center; gap: calc(var(--u) * 6); font-size: calc(var(--u) * 12); font-weight: 800; }
  #bones canvas { width: calc(var(--u) * 12); height: calc(var(--u) * 11); image-rendering: pixelated; }
  #over { position: absolute; inset: 0; display: none; place-items: center; background: rgba(6, 5, 9, .6); }
  #over.on { display: grid; }
  /* выход из подземелья (его правило 2026-11-17: найденное сохраняется, только если выйти вовремя или перебить всех) */
  #leave { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--u) * 10 + env(safe-area-inset-top)); height: calc(var(--u) * 20); padding: 0 calc(var(--u) * 10);
    font: inherit; font-size: calc(var(--u) * 11); font-weight: 800; color: #efe6d2; border: 0; cursor: pointer; }
  #over button + button { margin-left: calc(var(--u) * 8); }
  #over div { padding: calc(var(--u) * 16) calc(var(--u) * 20); text-align: center; font-size: calc(var(--u) * 15); font-weight: 800; line-height: 1.35; }
  #over small { display: block; margin-top: calc(var(--u) * 4); font-size: calc(var(--u) * 12); font-weight: 600; opacity: .8; }
  #over button { margin-top: calc(var(--u) * 14); padding: calc(var(--u) * 9) calc(var(--u) * 22); border: 0; background: #3f9e7c; color: #f2fff8; font: inherit; font-size: calc(var(--u) * 14);
    box-shadow: 0 0 0 calc(var(--u) * 2) #14151b, inset 0 calc(var(--u) * -3) 0 #2a7058, inset 0 calc(var(--u) * 2) 0 #6fd0a8; }
  /* карта комнат: пройденные — светлые, текущая — золотая (его просьба 2026-11-17: уровень из комнат-экранов) */
  #map { position: absolute; left: calc(var(--u) * 10); top: calc(var(--u) * 38 + env(safe-area-inset-top)); width: calc(var(--u) * 60); height: calc(var(--u) * 60); image-rendering: pixelated; opacity: .85; pointer-events: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 6 + env(safe-area-inset-bottom)); text-align: center; font-size: calc(var(--u) * 10); font-weight: 600; opacity: .55; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="216" height="384"></canvas>
  <canvas id="map" width="40" height="40"></canvas>
  <div id="hud"><div id="hp" class="pan"><i></i><b>100</b></div><div id="bones" class="pan"><canvas id="boneic" width="12" height="11"></canvas><span id="bonen">0</span></div></div>
  
  <button id="leave" class="pan" type="button">выйти</button>
  <div id="over"><div class="pan"><span id="overt"></span><small id="overs"></small><button id="again" type="button">Ещё раз</button><button id="home" type="button">В убежище</button></div></div>
</div>
<script>
(function () {
  // Изометрическое подземелье (его выбор 2026-11-17: «изометрия красивее»). Тайлы — из его листа (iso/*.png, нарезка исходники/нарезать_изометрию.py).
  // Мир считается в клетках пола (u, v); на экран клетка ложится ромбом 48×24. Комната 9×9, камера ведёт героя по горизонтали.
  var W = 216, H = 384, UW = 360, stage = document.getElementById("stage"), cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  function fit() { stage.style.setProperty("--u", stage.clientWidth / UW + "px"); } fit(); addEventListener("resize", fit);
  function rng(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function px(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); }
  function sprite(c, x, y, rows, pal) { for (var j = 0; j < rows.length; j++) for (var i = 0; i < rows[j].length; i++) { var ch = rows[j][i]; if (ch !== "." && pal[ch]) px(c, x + i, y + j, 1, 1, pal[ch]); } }
  function mk(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

  var TW = 96, TH = 48;                                        // ромб клетки пола: тайлы вдвое крупнее относительно героя (его выбор 2026-11-17)
  function P(u, v) { return [(u - v) * TW / 2, (u + v) * TH / 2]; }      // клетка мира → точка экрана комнаты

  // ---------- картинки из его листа ----------

    "crys_blue", "crys_teal", "crys_violet", "crys_green", "crys_big", "crate", "crates", "barrel", "mush", "mush2", "bones", "skull", "rocks", "rock_big", "brazier", "circle", "lantern", "stalag"], wait = NAMES.length + 1;
  NAMES.forEach(function (n) { var im = new Image(); im.onload = function () { if (!--wait) start(); }; im.src = "iso/" + n + ".png?v=7"; IMG[n] = im; });
  var HERO = new Image(); HERO.onload = function () { if (!--wait) start(); }; HERO.src = "hero.png";
  var CW = 64, CH = 56, AX = 32, AY = 53;
  var ROW = { idle_front: [0, 2], idle_back: [1, 2], idle_side: [2, 2], walk_front: [3, 4], walk_back: [4, 4], walk_side: [5, 4], hit_side: [7, 3], hurt_side: [8, 3], die: [9, 3] };

  // ---------- слизень, кость ----------
  var SL = { k: "#10202c", a: "#2f8fc4", A: "#5cc0ee", h: "#c8f1ff", d: "#1d6a96", e: "#0b0a10" };
  var slimeF = [
    ["......kkkkkkkk......", "....kkAAAAAAAAkk....", "...kAAhhAAAAAAAAk...", "..kAAhhAAAAAAAAAAk..", ".kaAAAAAAAAAAAAAAak.", ".kaAAAeeAAAAeeAAAak.", "kaaAAAeeAAAAeeAAAaak", "kaaAAAAAAAAAAAAAAaak", "kaaaAAAAAAAAAAAAaaak", "kdaaaaaAAAAAAaaaaadk", "kddaaaaaaaaaaaaaaddk", ".kddddaaaaaaaadddk..", "..kkkkkkkkkkkkkkkk.."],
    ["....................", "....................", ".....kkkkkkkkkk.....", "...kkAAAAAAAAAAkk...", "..kAAhhAAAAAAAAAAk..", ".kaAhhAAAAAAAAAAAak.", "kaaAAAeeAAAAeeAAAaak", "kaaAAAeeAAAAeeAAAaak", "kaaaAAAAAAAAAAAAaaak", "kdaaaaaAAAAAAaaaaadk", "kddaaaaaaaaaaaaaaddk", "kdddddaaaaaaaaddddk.", ".kkkkkkkkkkkkkkkkkk."]
  ].map(function (rows) { var c = mk(20, 13); sprite(c.getContext("2d"), 0, 0, rows, SL); return c; });
  var slimeHit = slimeF.map(function (src) { var c = mk(20, 13), g = c.getContext("2d"); g.drawImage(src, 0, 0); g.globalCompositeOperation = "source-atop"; g.fillStyle = "#ffffff"; g.fillRect(0, 0, 20, 13); return c; });
  var BONE = ["........kk..", ".......kWWk.", "......kWWWWk", ".....kWWkWwk", "....kWWk.kk.", "...kWWk.....", ".kkWWk......", "kWWkwk......", "kWWWwk......", ".kWwk.......", "..kk........"], BP = { k: "#3c362d", W: "#efe8d6", w: "#b9b09a" };
  var boneC = mk(12, 11); sprite(boneC.getContext("2d"), 0, 0, BONE, BP); sprite(document.getElementById("boneic").getContext("2d"), 0, 0, BONE, BP);

  // ---------- уровень: комнаты разной формы (его просьба 2026-11-17: «сложные формы, разные комнаты») ----------
  // Комната — сетка клеток w×h, open[j][i] — есть ли пол. Стены строятся сами: на каждом заднем крае пола, за которым пусто.
  // Направления к соседним комнатам: mu — вверх-влево (край u = 0), mv — вверх-вправо (v = 0), pu — вниз-вправо (u = w), pv — вниз-влево (v = h).
  var rooms, cur, hero, fx, bones, done, trans;
  function grid(w, h, val) { var g = []; for (var j = 0; j < h; j++) { g.push([]); for (var i = 0; i < w; i++) g[j].push(val); } return g; }
  function shape(rr, kind) {

    else if (kind === "L") { w = 6 + Math.floor(rr() * 3); h = 6 + Math.floor(rr() * 3); o = grid(w, h, 1); a = Math.floor(w * (.4 + rr() * .2)); b = Math.floor(h * (.4 + rr() * .2));
      var cx = rr() < .5, cy = rr() < .5; for (j = 0; j < b; j++) for (i = 0; i < a; i++) o[cy ? j : h - 1 - j][cx ? i : w - 1 - i] = 0; }
    else if (kind === "cross") { w = h = 7 + 2 * Math.floor(rr() * 2); o = grid(w, h, 0); a = 2 + Math.floor(rr() * 2); var m = Math.floor((w - a) / 2);
      for (j = 0; j < h; j++) for (i = 0; i < w; i++) if ((i >= m && i < m + a) || (j >= m && j < m + a)) o[j][i] = 1; }
    else if (kind === "ring") { w = 7 + Math.floor(rr() * 2); h = 7 + Math.floor(rr() * 2); o = grid(w, h, 1);
      for (j = 2; j < h - 2; j++) for (i = 2; i < w - 2; i++) o[j][i] = 0; }
    else if (kind === "cave") { w = 8 + Math.floor(rr() * 3); h = 8 + Math.floor(rr() * 3); o = grid(w, h, 0);
      for (j = 1; j < h - 1; j++) for (i = 1; i < w - 1; i++) o[j][i] = rr() < .6 ? 1 : 0;
      for (var it = 0; it < 4; it++) { var n2 = grid(w, h, 0);
        for (j = 1; j < h - 1; j++) for (i = 1; i < w - 1; i++) { var c = 0; for (b = -1; b <= 1; b++) for (a = -1; a <= 1; a++) c += o[j + b][i + a]; n2[j][i] = c >= 5 ? 1 : 0; }
        o = n2; } }
    else { w = 5 + Math.floor(rr() * 4); h = 5 + Math.floor(rr() * 4); o = grid(w, h, 1); }
    return { w: w, h: h, open: o };
  }
  function carve(rm, i0, j0, i1, j1) {                                    // проход «углом»: сначала по i, потом по j
    var i = i0, j = j0; rm.open[j][i] = 1;
    while (i !== i1) { i += i1 > i ? 1 : -1; rm.open[j][i] = 1; }
    while (j !== j1) { j += j1 > j ? 1 : -1; rm.open[j][i] = 1; }
  }
  function makeLevel(seed) {
    var r = rng(seed), map = {}, list = [], n = 6 + Math.floor(r() * 3);
    function add(x, y) { var k = x + "," + y; if (!map[k]) { map[k] = { gx: x, gy: y, seed: Math.floor(r() * 1e9) }; list.push(map[k]); } return map[k]; }
    add(0, 0);
    while (list.length < n) {
      var from = list[Math.floor(r() * list.length)], d = [[1, 0], [-1, 0], [0, -1], [0, 1]][Math.floor(r() * 4)], to = add(from.gx + d[0], from.gy + d[1]);
      if (d[0] === 1) from.pu = to.mu = true; else if (d[0] === -1) from.mu = to.pu = true; else if (d[1] === 1) from.pv = to.mv = true; else from.mv = to.pv = true;
    }
    var KINDS = ["rect", "L", "cross", "corridor", "ring", "cave", "hall", "L", "cave"];
    list.forEach(function (rm, k) {
      var rr = rng(rm.seed), i, j, kind = k === 0 ? "rect" : KINDS[Math.floor(rr() * KINDS.length)];
      var sh = shape(rr, kind === "hall" ? "rect" : kind); rm.w = sh.w; rm.h = sh.h; rm.open = sh.open; rm.kind = kind;
      var ci = Math.floor(rm.w / 2), cj = Math.floor(rm.h / 2);
      if (kind === "ring") { ci = 1; cj = 1; }                                  // у кольца середина — провал, «центр» — на самом кольце
      rm.open[cj][ci] = 1; rm.ci = ci; rm.cj = cj;
      // проходы к соседям — от середины края до центра, чтобы до любого выхода можно было дойти
      rm.door = {};
      if (rm.mu) { rm.door.mu = Math.floor(rm.h / 2); carve(rm, 0, rm.door.mu, ci, cj); }
      if (rm.pu) { rm.door.pu = Math.floor(rm.h / 2); carve(rm, rm.w - 1, rm.door.pu, ci, cj); }
      if (rm.mv) { rm.door.mv = Math.floor(rm.w / 2); carve(rm, rm.door.mv, 0, ci, cj); }
      if (rm.pv) { rm.door.pv = Math.floor(rm.w / 2); carve(rm, rm.door.pv, rm.h - 1, ci, cj); }
      // всё, куда от центра не дойти, — убрать
      var seen = grid(rm.w, rm.h, 0), st = [[ci, cj]]; seen[cj][ci] = 1;
      while (st.length) { var q = st.pop(); [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (dd) { var x = q[0] + dd[0], y = q[1] + dd[1];
        if (x >= 0 && y >= 0 && x < rm.w && y < rm.h && rm.open[y][x] && !seen[y][x]) { seen[y][x] = 1; st.push([x, y]); } }); }
      for (j = 0; j < rm.h; j++) for (i = 0; i < rm.w; i++) if (!seen[j][i]) rm.open[j][i] = 0;
      rm.floor = grid(rm.w, rm.h, 0); for (j = 0; j < rm.h; j++) for (i = 0; i < rm.w; i++) { var fq = rr(); rm.floor[j][i] = fq < .55 ? 0 : fq < .7 ? 1 : fq < .8 ? 4 : fq < .9 ? 3 : fq < .95 ? 2 : 5; }   // floor5 — его плитка с провалом, реже прочих
      // стены: задний край клетки пола, за которым пусто (или край комнаты)
      rm.walls = [];
      for (j = 0; j < rm.h; j++) for (i = 0; i < rm.w; i++) {
        if (!rm.open[j][i]) continue;
        if (j === 0 || !rm.open[j - 1][i]) rm.walls.push({ side: "v", i: i, j: j, k: j === 0 && rm.mv && i === rm.door.mv ? "arch" : "wall" });
        if (i === 0 || !rm.open[j][i - 1]) rm.walls.push({ side: "u", i: i, j: j, k: i === 0 && rm.mu && j === rm.door.mu ? "arch" : "wall" });
      }
      var plain = rm.walls.filter(function (wl) { return wl.k === "wall"; }), nt = Math.min(plain.length, 2 + Math.floor(rr() * 3));
      for (var tt = 0; tt < nt; tt++) { var pk = plain.splice(Math.floor(rr() * plain.length), 1)[0]; pk.k = "torch"; }
      plain.forEach(function (wl) { if (rr() < .08) wl.k = "gate"; });
      // предметы: в зале — колоннада, в остальных — вразброс; не на проходах и не в центре
      var lane = grid(rm.w, rm.h, 0);
      function mark(i2, j2) { if (i2 >= 0 && j2 >= 0 && i2 < rm.w && j2 < rm.h) lane[j2][i2] = 1; }
      ["mu", "pu", "mv", "pv"].forEach(function (dk) { if (rm.door[dk] == null) return; var d0 = rm.door[dk];
        for (var t2 = 0; t2 < Math.max(rm.w, rm.h); t2++) { if (dk === "mu") mark(t2, d0); if (dk === "pu") mark(rm.w - 1 - t2, d0); if (dk === "mv") mark(d0, t2); if (dk === "pv") mark(d0, rm.h - 1 - t2); } });
      for (j = cj - 1; j <= cj + 1; j++) for (i = ci - 1; i <= ci + 1; i++) mark(i, j);
      if (rr() < .5) { var hatch = []; for (j = 0; j < rm.h; j++) for (i = 0; i < rm.w; i++) if (rm.open[j][i] && !lane[j][i]) hatch.push([i, j]);   // люк (его плитка 2026-11-17)
        if (hatch.length) { var hc = hatch[Math.floor(rr() * hatch.length)]; rm.floor[hc[1]][hc[0]] = 6; } }
      rm.props = []; var kinds = ["crys_blue", "crys_teal", "crys_violet", "crys_green", "crys_big", "crate", "crates", "barrel", "rocks", "rock_big", "brazier", "stalag", "mush", "mush2"];
      if (kind === "hall") { for (j = 2; j < rm.h - 1; j += 3) for (i = 2; i < rm.w - 1; i += 3) if (rm.open[j][i] && !lane[j][i]) rm.props.push({ i: i, j: j, k: rr() < .5 ? "stalag" : "crys_big" }); }
      else { var openCells = []; for (j = 0; j < rm.h; j++) for (i = 0; i < rm.w; i++) if (rm.open[j][i] && !lane[j][i]) openCells.push([i, j]);
        var np = Math.min(openCells.length, Math.floor(openCells.length / 9) + 1);
        for (tt = 0; tt < np; tt++) { var cc = openCells.splice(Math.floor(rr() * openCells.length), 1)[0]; rm.props.push({ i: cc[0], j: cc[1], k: kinds[Math.floor(rr() * kinds.length)] }); } }
      rm.decor = []; for (tt = 0; tt < 4; tt++) { var di = Math.floor(rr() * rm.w), dj = Math.floor(rr() * rm.h); if (rm.open[dj][di]) rm.decor.push({ u: di + .2 + rr() * .6, v: dj + .2 + rr() * .6, k: rr() < .5 ? "bones" : "skull" }); }
      if (kind === "rect" && rr() < .5) rm.decor.push({ u: ci + .5, v: cj + .5, k: "circle", flat: true });
      // слизни — на свободных клетках, не у входа
      rm.mobs = []; var nm = k === 0 ? 1 : 2 + Math.floor(rr() * 3), free = [];
      for (j = 0; j < rm.h; j++) for (i = 0; i < rm.w; i++) if (rm.open[j][i] && !rm.props.some(function (p) { return p.i === i && p.j === j; }) && Math.hypot(i - ci, j - cj) > 1.5) free.push([i, j]);
      for (tt = 0; tt < nm && free.length; tt++) { var f2 = free.splice(Math.floor(rr() * free.length), 1)[0]; rm.mobs.push({ u: f2[0] + .5, v: f2[1] + .5, hp: 3, t: rr() * 10, hit: 0, vu: 0, vv: 0, wu: 0, wv: 0, wt: 0 }); }
      rm.drops = []; rm.seen = k === 0;
    });
    return list;
  }
  function room(gx, gy) { for (var i = 0; i < rooms.length; i++) if (rooms[i].gx === gx && rooms[i].gy === gy) return rooms[i]; return null; }
  function cellOpen(i, j) {                                                     // клетка проходима: пол без предмета, или выход за край в проходе
    var rm = cur;
    if (i < 0) return !!rm.mu && j === rm.door.mu; if (i >= rm.w) return !!rm.pu && j === rm.door.pu;
    if (j < 0) return !!rm.mv && i === rm.door.mv; if (j >= rm.h) return !!rm.pv && i === rm.door.pv;
    return !!rm.open[j][i] && !rm.props.some(function (p) { return p.i === i && p.j === j; });
  }
  function blocked(u, v) { var r = .13; return !cellOpen(Math.floor(u - r), Math.floor(v - r)) || !cellOpen(Math.floor(u + r), Math.floor(v - r)) || !cellOpen(Math.floor(u - r), Math.floor(v + r)) || !cellOpen(Math.floor(u + r), Math.floor(v + r)); }
  function reset() {
    rooms = makeLevel(Date.now() & 0xffffff); cur = rooms[0];
    hero = { u: cur.ci + .5, v: cur.cj + .5, dir: "front", flip: 1, st: "idle", t: 0, hp: 100, inv: 0, hitDone: false };
    fx = []; bones = 0; done = false; trans = null; var p0 = P(hero.u, hero.v); camX = p0[0]; camY = p0[1];
    document.getElementById("over").classList.remove("on"); hud(); drawMap();
  }
  function hud() {
    document.querySelector("#hp i").style.transform = "scaleX(" + Math.max(0, hero.hp) / 100 + ")"; document.querySelector("#hp b").textContent = Math.max(0, Math.round(hero.hp));
    document.getElementById("bonen").textContent = bones;
  }
  var mapC = document.getElementById("map"), mg = mapC.getContext("2d");
  function drawMap() {
    var xs = rooms.map(function (r2) { return r2.gx; }), ys = rooms.map(function (r2) { return r2.gy; }), mnx = Math.min.apply(0, xs), mny = Math.min.apply(0, ys);
    mg.clearRect(0, 0, 40, 40);
    rooms.forEach(function (r2) { if (!r2.seen) return; var x = 2 + (r2.gx - mnx) * 8, y = 2 + (r2.gy - mny) * 8;

  window.__game = { hero: function () { return hero; }, room: function () { return cur; }, rooms: function () { return rooms; }, keys: keys, hit: function () { wantHit = true; }, joy: function (x, y) { joy.dx = x; joy.dy = y; }, goto: function (k) { cur = rooms[k]; cur.seen = true; hero.u = cur.ci + .5; hero.v = cur.cj + .5; var p2 = P(hero.u, hero.v); camX = p2[0]; camY = p2[1]; drawMap(); }, step: function (dt) { update(dt); draw(performance.now()); } };
})();
