<!doctype html>
<html lang="ru">

<title>Подземелье — изометрия</title>
<style>

  #armor { position: absolute; left: 0; top: calc(100% + var(--u) * 4); padding: 0 calc(var(--u) * 9); height: calc(var(--u) * 20); display: flex; align-items: center; gap: calc(var(--u) * 5); font-size: calc(var(--u) * 12); font-weight: 800; color: #e4ccff; }
  #armor[hidden] { display: none; }
  #armor canvas { width: calc(var(--u) * 13); height: auto; image-rendering: pixelated; }   /* под полоской здоровья, слева */
  #armor.hit { animation: armorHit .3s; } @keyframes armorHit { 50% { filter: brightness(2.2); transform: translateY(calc(var(--u) * -1)); } }
  #bones { padding: 0 calc(var(--u) * 10); height: calc(var(--u) * 20); display: flex; align-items: center; gap: calc(var(--u) * 6); font-size: calc(var(--u) * 12); font-weight: 800; }
  #bones canvas { width: calc(var(--u) * 12); height: calc(var(--u) * 11); image-rendering: pixelated; }
  #over { position: absolute; inset: 0; display: none; place-items: center; background: rgba(6, 5, 9, .6); }
  #over.on { display: grid; }
  /* выход из подземелья (его правило 2026-11-17: найденное сохраняется, только если выйти вовремя или перебить всех) */
  #leave { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--u) * 10 + env(safe-area-inset-top)); height: calc(var(--u) * 20); padding: 0 calc(var(--u) * 10);
    font: inherit; font-size: calc(var(--u) * 11); font-weight: 800; color: #efe6d2; border: 0; cursor: pointer; }
  #over button + button { margin-left: calc(var(--u) * 8); }
  #over button[hidden] + button { margin-left: 0; }
  #over #stay { background: #3a3e4b; color: #efe6d2; box-shadow: 0 0 0 calc(var(--u) * 2) #14151b, inset 0 calc(var(--u) * -3) 0 #23252e, inset 0 calc(var(--u) * 2) 0 #5a5f70; }
  #over div { padding: calc(var(--u) * 16) calc(var(--u) * 20); text-align: center; font-size: calc(var(--u) * 15); font-weight: 800; line-height: 1.35; }
  #over small { display: block; margin-top: calc(var(--u) * 4); font-size: calc(var(--u) * 12); font-weight: 600; opacity: .8; }
  #over button { margin-top: calc(var(--u) * 14); padding: calc(var(--u) * 9) calc(var(--u) * 22); border: 0; background: #3f9e7c; color: #f2fff8; font: inherit; font-size: calc(var(--u) * 14);
    box-shadow: 0 0 0 calc(var(--u) * 2) #14151b, inset 0 calc(var(--u) * -3) 0 #2a7058, inset 0 calc(var(--u) * 2) 0 #6fd0a8; }
  /* карта комнат: пройденные — светлые, текущая — золотая (его просьба 2026-11-17: уровень из комнат-экранов) */
  #map { position: absolute; left: calc(var(--u) * 10); top: calc(var(--u) * 38 + env(safe-area-inset-top)); width: calc(var(--u) * 60); height: calc(var(--u) * 60); image-rendering: pixelated; opacity: .85; pointer-events: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 6 + env(safe-area-inset-bottom)); text-align: center; font-size: calc(var(--u) * 10); font-weight: 600; opacity: .55; pointer-events: none; }
</style>

  <div id="hud"><div id="hp" class="pan"><i></i><b>100</b><div id="armor" class="pan" hidden><canvas id="armoric" width="9" height="10"></canvas><span id="armorn">×1</span></div></div><div id="bones" class="pan"><canvas id="boneic" width="12" height="11"></canvas><span id="bonen">0</span></div></div>
  
  <button id="leave" class="pan" type="button">выйти</button>
  <div id="over"><div class="pan"><span id="overt"></span><small id="overs"></small><button id="again" type="button">Ещё раз</button><button id="home" type="button">В убежище</button><button id="stay" type="button" hidden>Остаться</button><button id="quit" type="button" hidden>Выйти</button></div></div>
</div>
<script>
(function () {
  // Изометрическое подземелье (его выбор 2026-11-17: «изометрия красивее»). Тайлы — из его листа (iso/*.png, нарезка исходники/нарезать_изометрию.py).

  var W = 216, H = 384, UW = 360, stage = document.getElementById("stage"), cv = document.getElementById("cv"), ctx = cv.getContext("2d");

  // ---------- картинки из его листа ----------
  var IMG = {}, NAMES = ["floor0", "floor1", "floor2", "floor3", "floor4", "floor5", "floor6", "floor7", "floor8", "floor9", "floor10", "t_blue", "t_violet", "t_lava", "wu_plain1", "wu_plain2", "wu_plain3", "wu_pil1", "wu_pil2", "wu_pil3", "wu_end", "wu_gate", "wu_door", "wu_arch", "wu_archin", "wu_torch1", "wu_torch2", "wu_torch3",
    "wv_plain1", "wv_plain2", "wv_plain3", "wv_pil1", "wv_pil2", "wv_pil3", "wv_end", "wv_gate", "wv_door", "wv_arch", "wv_archin", "wv_torch1", "wv_torch2", "wv_torch3", "w_corner", "brazier_f0", "brazier_f1", "brazier_f2", "brazier_f3", "brazier_f4", "brazier_f5", "brazier_f6", "brazier_f7", "brazier_f8",
    "crys_blue", "crys_teal", "crys_violet", "crys_green", "crys_big", "crate", "crates", "barrel", "mush", "mush2", "bones", "skull", "rocks", "rock_big", "brazier", "circle", "lantern", "stalag", "booster", "cardback", "bookicon", "sdoor_u", "sdoor_v"];   // бустер и рубашка — его рисунки (2026-11-19)
  NAMES.slice().forEach(function (n) { if (/^w[uv]_/.test(n) && !/in$/.test(n)) NAMES.push(n + "_x", n + "_t", n + "_xt"); });   // _t — с цоколем под колонной ближнего конца (за ним нет пола)   // *_x — дальний конец одиночной стены с косым срезом плиты (его правка 2026-11-19)
  var wait = NAMES.length + 3;
  NAMES.forEach(function (n) { var im = new Image(); im.onload = function () { if (!--wait) start(); }; im.src = "iso/" + n + ".png?v=25"; IMG[n] = im; });
  var HERO = new Image(); HERO.onload = function () { if (!--wait) start(); }; HERO.src = "hero.png?v=2";
  var STARBG = new Image(); STARBG.onload = function () { if (!--wait) start(); }; STARBG.src = "starfield.png?v=1";
  // странная комната — из его пяти листов (2026-11-19, исходники «Подземелье — прототип/исходники/странная_комната»): iso/sr.json — что есть по видам
  // (алтари, углы, плиты стен, пол, убранство); каждый поход комната собирается заново из этого набора
  var SR = null;
  // картинки странной комнаты (≈100 штук) грузятся только для похода, где она есть (его жалоба 2026-11-20: бой открывался 15+ секунд
  // чёрным экраном — ждал их и в малом подземелье). Сам список (sr.json) — сразу, он маленький
  var srWait = null;
  function srLoad(then) {
    if (!SR) return then();
    if (!srWait) { srWait = []; var ns = [], left = 0;
      Object.keys(SR).forEach(function (k) { SR[k].forEach(function (n) { if (typeof n === "string" && !IMG[n]) ns.push(n); }); }); left = ns.length;
      var fin = function () { var w = srWait; srWait = true; w.forEach(function (f) { f(); }); };
      if (!left) fin();
      ns.forEach(function (n) { var im = new Image(); im.onload = im.onerror = function () { if (!--left) fin(); }; im.src = "iso/" + n + ".png?v=25"; IMG[n] = im; }); }
    if (srWait === true) then(); else srWait.push(then);
  }
  fetch("iso/sr.json?v=20").then(function (r) { return r.json(); }).then(function (m) { SR = m; if (!--wait) start(); }).catch(function () { if (!--wait) start(); });
  var CW = 64, CH = 56, AX = 32, AY = 53;
  var ROW = { idle_front: [0, 2], idle_back: [1, 2], idle_side: [2, 2], walk_front: [3, 4], walk_back: [4, 4], walk_side: [5, 4], hit_side: [7, 3], hurt_side: [8, 3], die: [9, 3] };

  // ---------- слизень, кость ----------
  var SL = { k: "#10202c", a: "#2f8fc4", A: "#5cc0ee", h: "#c8f1ff", d: "#1d6a96", e: "#0b0a10" };
  var slimeF = [
    ["......kkkkkkkk......", "....kkAAAAAAAAkk....", "...kAAhhAAAAAAAAk...", "..kAAhhAAAAAAAAAAk..", ".kaAAAAAAAAAAAAAAak.", ".kaAAAeeAAAAeeAAAak.", "kaaAAAeeAAAAeeAAAaak", "kaaAAAAAAAAAAAAAAaak", "kaaaAAAAAAAAAAAAaaak", "kdaaaaaAAAAAAaaaaadk", "kddaaaaaaaaaaaaaaddk", ".kddddaaaaaaaadddk..", "..kkkkkkkkkkkkkkkk.."],
    ["....................", "....................", ".....kkkkkkkkkk.....", "...kkAAAAAAAAAAkk...", "..kAAhhAAAAAAAAAAk..", ".kaAhhAAAAAAAAAAAak.", "kaaAAAeeAAAAeeAAAaak", "kaaAAAeeAAAAeeAAAaak", "kaaaAAAAAAAAAAAAaaak", "kdaaaaaAAAAAAaaaaadk", "kddaaaaaaaaaaaaaaddk", "kdddddaaaaaaaaddddk.", ".kkkkkkkkkkkkkkkkkk."]
  ], SLROWS = slimeF;
  slimeF = SLROWS.map(function (rows) { var c = mk(20, 13); sprite(c.getContext("2d"), 0, 0, rows, SL); return c; });
  // плюющийся слизень (его идея 2026-11-20): кислотно-зелёный, держится поодаль и стреляет слизью; в первых комнатах его нет, в зале — один-два
  var SLG = { k: "#12240c", a: "#5a9a1e", A: "#9ad63a", h: "#eaffb0", d: "#34641a", e: "#0b0a10" };
  var slimeG = SLROWS.map(function (rows) { var c = mk(20, 13); sprite(c.getContext("2d"), 0, 0, rows, SLG); return c; });
  var slimeHit = slimeF.map(function (src) { var c = mk(20, 13), g = c.getContext("2d"); g.drawImage(src, 0, 0); g.globalCompositeOperation = "source-atop"; g.fillStyle = "#ffffff"; g.fillRect(0, 0, 20, 13); return c; });
  var BONE = ["........kk..", ".......kWWk.", "......kWWWWk", ".....kWWkWwk", "....kWWk.kk.", "...kWWk.....", ".kkWWk......", "kWWkwk......", "kWWWwk......", ".kWwk.......", "..kk........"], BP = { k: "#3c362d", W: "#efe8d6", w: "#b9b09a" };
  var boneC = mk(12, 11); sprite(boneC.getContext("2d"), 0, 0, BONE, BP); sprite(document.getElementById("boneic").getContext("2d"), 0, 0, BONE, BP);

  // ---------- уровень: комнаты разной формы (его просьба 2026-11-17: «сложные формы, разные комнаты») ----------
  // Комната — сетка клеток w×h, open[j][i] — есть ли пол. Стены строятся сами: на каждом заднем крае пола, за которым пусто.
  // Направления к соседним комнатам: mu — вверх-влево (край u = 0), mv — вверх-вправо (v = 0), pu — вниз-вправо (u = w), pv — вниз-влево (v = h).
  var rooms, cur, hero, fx, bones, done, trans;
  function grid(w, h, val) { var g = []; for (var j = 0; j < h; j++) { g.push([]); for (var i = 0; i < w; i++) g[j].push(val); } return g; }
  function shape(rr, kind) {
    var w, h, o, i, j, a, b;
    if (kind === "corridor") { if (rr() < .5) { w = 2 + Math.floor(rr() * 2); h = 8 + Math.floor(rr() * 3); } else { w = 8 + Math.floor(rr() * 3); h = 2 + Math.floor(rr() * 2); } o = grid(w, h, 1); }
    else if (kind === "L") { w = 6 + Math.floor(rr() * 3); h = 6 + Math.floor(rr() * 3); o = grid(w, h, 1); a = Math.floor(w * (.4 + rr() * .2)); b = Math.floor(h * (.4 + rr() * .2));
      var cx = rr() < .5, cy = rr() < .5; for (j = 0; j < b; j++) for (i = 0; i < a; i++) o[cy ? j : h - 1 - j][cx ? i : w - 1 - i] = 0; }
    else if (kind === "cross") { w = h = 7 + 2 * Math.floor(rr() * 2); o = grid(w, h, 0); a = 2 + Math.floor(rr() * 2); var m = Math.floor((w - a) / 2);
      for (j = 0; j < h; j++) for (i = 0; i < w; i++) if ((i >= m && i < m + a) || (j >= m && j < m + a)) o[j][i] = 1; }
    else if (kind === "ring") { w = 7 + Math.floor(rr() * 2); h = 7 + Math.floor(rr() * 2); o = grid(w, h, 1);
      for (j = 2; j < h - 2; j++) for (i = 2; i < w - 2; i++) o[j][i] = 0; }
    else if (kind === "cave") { w = 8 + Math.floor(rr() * 3); h = 8 + Math.floor(rr() * 3); o = grid(w, h, 0);
      for (j = 1; j < h - 1; j++) for (i = 1; i < w - 1; i++) o[j][i] = rr() < .6 ? 1 : 0;
      for (var it = 0; it < 4; it++) { var n2 = grid(w, h, 0);
        for (j = 1; j < h - 1; j++) for (i = 1; i < w - 1; i++) { var c = 0; for (b = -1; b <= 1; b++) for (a = -1; a <= 1; a++) c += o[j + b][i + a]; n2[j][i] = c >= 5 ? 1 : 0; }
        o = n2; } }
    else { w = 5 + Math.floor(rr() * 4); h = 5 + Math.floor(rr() * 4); o = grid(w, h, 1); }
    return { w: w, h: h, open: o };
  }
  function carve(rm, i0, j0, i1, j1) {                                    // проход «углом»: сначала по i, потом по j
    var i = i0, j = j0; rm.open[j][i] = 1;
    while (i !== i1) { i += i1 > i ? 1 : -1; rm.open[j][i] = 1; }
    while (j !== j1) { j += j1 > j ? 1 : -1; rm.open[j][i] = 1; }
  }
  // размер подземелья (его решение 2026-11-19): малое 3–4 зала, среднее 6–8, большое 10–12
  var SIZE = { s: [3, 2], m: [6, 3], l: [10, 3] }[(location.search.match(/size=([sml])/) || [])[1] || "m"];
  var SECRET = /secret=1/.test(location.search), banner = 0, banT = "", banS = "", SIZEK = (location.search.match(/size=([sml])/) || [])[1] || "m";
  function makeLevel(seed) {
    var r = rng(Math.imul(seed ^ 0x5bd1e995, 0x27d4eb2d) ^ (seed >>> 13)), map = {}, list = [], n = SIZE[0] + Math.floor(r() * SIZE[1]);
    function add(x, y) { var k = x + "," + y; if (!map[k]) { map[k] = { gx: x, gy: y, seed: Math.floor(r() * 1e9) }; list.push(map[k]); } return map[k]; }

      if (d[0] === 1) from.pu = to.mu = true; else if (d[0] === -1) from.mu = to.pu = true; else if (d[1] === 1) from.pv = to.mv = true; else from.mv = to.pv = true;
    }
    // глубина комнаты — сколько комнат от входа (его решение 2026-11-19: «чем глубже, тем монстров больше»)
    list[0].depth = 0; var bq = [list[0]];
    while (bq.length) { var q0 = bq.shift();
      [["pu", 1, 0], ["mu", -1, 0], ["pv", 0, 1], ["mv", 0, -1]].forEach(function (dd) { var nb = q0[dd[0]] && map[(q0.gx + dd[1]) + "," + (q0.gy + dd[2])];
        if (nb && nb.depth == null) { nb.depth = q0.depth + 1; bq.push(nb); } }); }
    // тайная комната (его решение 2026-11-19): поход со Странной похлёбкой — у самой дальней комнаты странная дверь в задней стене,
    // за ней пустой зал без слизней и на руне — легендарная карта (пока скрыта, откроется в будущей игре)
    var host = null;
    if (SECRET) {
      var byDepth = list.slice().sort(function (a1, b1) { return b1.depth - a1.depth; });
      for (var hk = 0; hk < byDepth.length && !host; hk++) { var hr = byDepth[hk];
        if (!map[(hr.gx - 1) + "," + hr.gy]) { host = hr; host.secDir = "mu"; } else if (!map[hr.gx + "," + (hr.gy - 1)]) { host = hr; host.secDir = "mv"; } }
      if (host) { var sr = host.secDir === "mu" ? add(host.gx - 1, host.gy) : add(host.gx, host.gy - 1); sr.secret = true; sr.depth = host.depth + 1;
        if (host.secDir === "mu") { host.mu = true; sr.pu = true; } else { host.mv = true; sr.pv = true; } }
    }
    var KINDS = ["rect", "L", "cross", "corridor", "ring", "cave", "hall", "L", "cave"];
    list.forEach(function (rm, k) {
      var rr = rng(rm.seed), i, j, kind = k === 0 || rm.secret ? "rect" : KINDS[Math.floor(rr() * KINDS.length)];
      var sh = shape(rr, kind === "hall" ? "rect" : kind);
      if (rm.secret) { sh = { w: 6, h: 6, open: [] }; for (j = 0; j < 6; j++) { sh.open.push([]); for (i = 0; i < 6; i++) sh.open[j].push(1); } }   // странная комната — маленькая, 6×6 (его решение 2026-11-19)
      rm.w = sh.w; rm.h = sh.h; rm.open = sh.open; rm.kind = kind;
      var ci = Math.floor(rm.w / 2), cj = Math.floor(rm.h / 2);
      if (kind === "ring") { ci = 1; cj = 1; }                                  // у кольца середина — провал, «центр» — на самом кольце
      rm.open[cj][ci] = 1; rm.ci = ci; rm.cj = cj;
      // проходы к соседям — от середины края до центра, чтобы до любого выхода можно было дойти
      rm.door = {};
      if (rm.mu) { rm.door.mu = Math.floor(rm.h / 2); carve(rm, 0, rm.door.mu, ci, cj); }
      if (rm.pu) { rm.door.pu = Math.floor(rm.h / 2); carve(rm, rm.w - 1, rm.door.pu, ci, cj); }
      if (rm.mv) { rm.door.mv = Math.floor(rm.w / 2); carve(rm, rm.door.mv, 0, ci, cj); }
      if (rm.pv) { rm.door.pv = Math.floor(rm.w / 2); carve(rm, rm.door.pv, rm.h - 1, ci, cj); }
      // всё, куда от центра не дойти, — убрать

  var last = 0, paused = false; function loop(ts) { requestAnimationFrame(loop); var dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts; if (!paused && !rev && !spell) update(dt); draw(ts); }   // пауза — пока спрашиваем «выйти?»
  // оплата едой — здесь, когда страница боя уже открылась (его жалоба 2026-11-19: GitHub отдавал 404 вместо боя, а еду убежище уже списало).

  function start() {

    if (!RUN && !/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) { closedPage(); return; }

    hero: function () { return hero; }, room: function () { return cur; }, rooms: function () { return rooms; }, keys: keys, hit: function () { wantHit = true; }, frame: function (ts) { draw(ts); }, joy: function (x, y) { joy.dx = x; joy.dy = y; }, goto: function (k) { cur = rooms[k]; cur.seen = true; hero.u = cur.ci + .5; hero.v = cur.cj + .5; var p2 = P(hero.u, hero.v); camX = p2[0]; camY = p2[1]; drawMap(); }, step: function (dt) { update(dt); draw(performance.now()); } };
