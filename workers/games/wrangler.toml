name = "starguardian-games"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
FARM_BREEDING_START = "1795879680"
FARM_PAUSE_UNTIL_MS = "1795824060000" # 28 ноября 2026, 03:01 по Минску

# умное размещение (сервер рядом с базой) включали 2026-11-17 и вернули как было 2026-11-18 по его просьбе:
# сервер снова запускается рядом с игроком
# база в Восточной Европе (eeur): ближе к игрокам и слушателям — запросы не ходят через океан
[[d1_databases]]
binding = "DB"
database_name = "starguardian-games-eu"
database_id = "1f480dae-68eb-4e0d-956b-3f875ab89153"
