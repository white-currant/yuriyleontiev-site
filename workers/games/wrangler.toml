name = "starguardian-games"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

# умное размещение (2026-11-17): сервер работает рядом с базой, а не рядом с игроком — на загрузку фермы ~50 запросов к базе,
# и раньше каждый шёл через полмира (у игрока с VPN в США ферма грузилась 4 с, покупка 7 с)
[placement]
mode = "smart"

# база в Восточной Европе (eeur): ближе к игрокам и слушателям — запросы не ходят через океан
[[d1_databases]]
binding = "DB"
database_name = "starguardian-games-eu"
database_id = "1f480dae-68eb-4e0d-956b-3f875ab89153"
